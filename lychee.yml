# lychee configuration for link checking
# Scan the entire repository; lychee will look for Markdown and HTML links.
scan:
  - .

# Sites that should be skipped. Add entries here when external hosts
# deliberately block bots or return intermittent 403s.
exclude:
  - "https://example.com"

options:
  timeout: 30000        # 30 seconds per attempt
  retry: 2              # retry failed requests twice
  http:
    maxSockets: 10
    headers:
      user-agent: "sec-engineers-link-checker"
